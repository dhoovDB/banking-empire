<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Banking Empire four-layer architecture: config, engine, renderer, ui, with BankingEmpire.jsx as the only smart component.">
  <rect x="0" y="0" width="880" height="380" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Root smart component -->
  <rect x="120" y="26" width="640" height="56" rx="8" fill="#1f2328"/>
  <text x="440" y="50" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">BankingEmpire.jsx</text>
  <text x="440" y="70" text-anchor="middle" fill="#adbac7" font-size="12.5">the one smart component · owns all React state · imports all four layers</text>

  <!-- Dashed connectors from root down to each layer -->
  <g stroke="#8c959f" stroke-width="1.3" stroke-dasharray="4 4">
    <line x1="130" y1="82" x2="130" y2="196"/>
    <line x1="336" y1="82" x2="336" y2="196"/>
    <line x1="542" y1="82" x2="542" y2="196"/>
    <line x1="748" y1="82" x2="748" y2="196"/>
  </g>

  <!-- Layer boxes -->
  <!-- config -->
  <rect x="40" y="196" width="180" height="120" rx="8" fill="#dbeafe" stroke="#4c8bf5" stroke-width="1.5"/>
  <text x="130" y="232" text-anchor="middle" fill="#1f2328" font-size="16" font-weight="700">config/</text>
  <text x="130" y="262" text-anchor="middle" fill="#30363d" font-size="12.5">Game rules as data</text>
  <text x="130" y="288" text-anchor="middle" fill="#57606a" font-size="11.5">imports nothing</text>

  <!-- engine -->
  <rect x="246" y="196" width="180" height="120" rx="8" fill="#dcfce7" stroke="#2ea44f" stroke-width="1.5"/>
  <text x="336" y="232" text-anchor="middle" fill="#1f2328" font-size="16" font-weight="700">engine/</text>
  <text x="336" y="262" text-anchor="middle" fill="#30363d" font-size="12.5">Pure functions</text>
  <text x="336" y="288" text-anchor="middle" fill="#57606a" font-size="11.5">no React · no side effects</text>

  <!-- renderer -->
  <rect x="452" y="196" width="180" height="120" rx="8" fill="#fef9c3" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="542" y="232" text-anchor="middle" fill="#1f2328" font-size="16" font-weight="700">renderer/</text>
  <text x="542" y="262" text-anchor="middle" fill="#30363d" font-size="12.5">Canvas drawing</text>
  <text x="542" y="288" text-anchor="middle" fill="#57606a" font-size="11.5">draws state · no math</text>

  <!-- ui -->
  <rect x="658" y="196" width="180" height="120" rx="8" fill="#fae8ff" stroke="#a855c7" stroke-width="1.5"/>
  <text x="748" y="232" text-anchor="middle" fill="#1f2328" font-size="16" font-weight="700">ui/</text>
  <text x="748" y="262" text-anchor="middle" fill="#30363d" font-size="12.5">Dumb components</text>
  <text x="748" y="288" text-anchor="middle" fill="#57606a" font-size="11.5">props in · render out</text>

  <!-- Arrows between layers (left to right build order) -->
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#57606a"/>
    </marker>
  </defs>
  <g stroke="#57606a" stroke-width="2" marker-end="url(#arrow)">
    <line x1="222" y1="256" x2="242" y2="256"/>
    <line x1="428" y1="256" x2="448" y2="256"/>
    <line x1="634" y1="256" x2="654" y2="256"/>
  </g>

  <!-- Caption -->
  <text x="440" y="352" text-anchor="middle" fill="#57606a" font-size="12.5">Each layer imports only from the layers to its left — a boundary enforced by ESLint, not just documented.</text>
</svg>
